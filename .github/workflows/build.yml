name: build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Build Debug
        run: dotnet build "DDF - Program Language Editor.sln" --configuration Debug --disable-build-servers --maxcpucount:1

      - name: Run core tests
        run: .\tests\DDFLanguageEditor.Tests\bin\Debug\DDFLanguageEditor.Tests.exe

      - name: Build Release
        run: dotnet build "DDF - Program Language Editor.sln" --configuration Release --no-restore --disable-build-servers --maxcpucount:1

      - name: Publish unsigned self-contained verification candidate
        if: github.event_name != 'workflow_dispatch'
        run: .\tools\publish-release.ps1 -SkipSignedManifest

      - name: Publish signed self-contained Windows x64 release
        if: github.event_name == 'workflow_dispatch'
        env:
          DDF_RELEASE_SIGNING_KEY_PKCS8_BASE64: ${{ secrets.DDF_RELEASE_SIGNING_KEY_PKCS8_BASE64 }}
        run: .\tools\publish-release.ps1 -SigningKeyId official-2026

      - name: Upload self-contained package
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: DDFLanguageEditor-win-x64-self-contained
          path: |
            .artifacts/release/*.zip
            .artifacts/release/*.sha256
            .artifacts/release/ddf-release-manifest.json
          if-no-files-found: error
          retention-days: 1
